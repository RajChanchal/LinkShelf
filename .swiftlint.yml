# SwiftLint baseline for LinkShelf.

included:
  - LinkShelf
  - LinkShelfShare

excluded:
  - .build
  - DerivedData

only_rules:
  - array_init
  - empty_string
  - empty_count
  - empty_enum_arguments
  - fatal_error_message
  - force_unwrapping
  - redundant_nil_coalescing
  - syntactic_sugar
  - unused_import
  - unused_optional_binding

reporter: xcode
